name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  channel:
    name: Release channel
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.rel.outputs.preview }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Classify the tag
        id: rel
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_call' && inputs.tag || github.ref_name }}
        run: |
          git fetch origin main
          commit="$(git rev-parse "HEAD^{commit}")"
          tag="$RELEASE_TAG"
          if printf '%s\n' "$tag" | grep -Eq -- '-(rc|preview|alpha|beta)([.]|$)'; then
            preview=true
          else
            preview=false
          fi
          on_main=false
          if git merge-base --is-ancestor "$commit" origin/main; then
            on_main=true
          fi
          if [ "$preview" = false ] && [ "$on_main" = false ]; then
            echo "A stable tag must point at main. From dev, tag vX.Y.Z-rc.N."
            exit 1
          fi
          if [ "$preview" = true ] && [ "$on_main" = true ]; then
            echo "A preview tag must point at dev, not main."
            exit 1
          fi
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.channel.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: "1.26"

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.channel.outputs.tag }}

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  image:
    name: Image
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - name: Configure a fast APT mirror
        uses: vegardit/fast-apt-mirror.sh@1.4.5

      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.channel.outputs.tag }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: |
            ghcr.io/bravo68web/atrium
            bravo68web/atrium
          tags: |
            type=semver,pattern={{version}},value=${{ needs.channel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.channel.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.channel.outputs.tag }}
            type=raw,value=preview,enable=${{ needs.channel.outputs.preview == 'true' }}
          flavor: |
            latest=auto

      - name: Image version
        id: ver
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the GHCR image
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: ghcr.io/bravo68web/atrium
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the Docker Hub image
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: docker.io/bravo68web/atrium
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
