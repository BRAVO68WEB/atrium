name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  channel:
    name: Release channel
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.rel.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the tag
        id: rel
        run: |
          git fetch origin main
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          tag="${GITHUB_REF_NAME}"
          if printf '%s\n' "$tag" | grep -Eq -- '-(rc|preview|alpha|beta)([.]|$)'; then
            preview=true
          else
            preview=false
          fi
          on_main=false
          if git merge-base --is-ancestor "$commit" origin/main; then
            on_main=true
          fi
          if [ "$preview" = false ] && [ "$on_main" = false ]; then
            echo "A stable tag must point at main. From dev, tag vX.Y.Z-rc.N."
            exit 1
          fi
          if [ "$preview" = true ] && [ "$on_main" = true ]; then
            echo "A preview tag must point at dev, not main."
            exit 1
          fi
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/bravo68web/atrium
            bravo68web/atrium
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=preview,enable=${{ needs.channel.outputs.preview == 'true' }}
          flavor: |
            latest=auto

      - name: Image version
        id: ver
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
