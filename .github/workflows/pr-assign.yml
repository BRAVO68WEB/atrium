name: Pull request assignee

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    name: Assign the author
    if: github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - name: Assign the pull request author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          if gh api --method POST "repos/${REPO}/issues/${PR}/assignees" -f "assignees[]=${LOGIN}" >/dev/null; then
            echo "Assigned ${LOGIN}."
          else
            echo "Could not assign ${LOGIN}."
          fi
