name: Preview tag

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: preview-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag dev
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the green commit
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Push the next preview tag
        id: tag
        run: |
          tag="$(.github/scripts/next-preview-tag.sh --push)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
