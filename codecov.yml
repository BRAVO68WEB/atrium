coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 45%
        threshold: 1%

# These paths are tests, examples, or docs. They are not the server.
ignore:
  - "e2e"
  - "docs"
  - "migrations"
  - "internal/hashalgo/examples"
  - "**/*_test.go"
