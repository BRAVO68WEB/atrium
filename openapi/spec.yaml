        "200":
          description: MFA enabled

  /api/users/{userID}/mfa/status:
    get:
      tags: [Management]
      summary: Read MFA status for a user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: MFA status

  /api/users/{userID}/mfa/disable:
    post:
      tags: [Management]
      summary: Disable MFA for a user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: MFA disabled

  /api/users/{userID}/push/revoke:
    post:
      tags: [Management]
      summary: Revoke every authenticator for a user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Devices revoked

  /api/users/{userID}/push/enroll:
    post:
      tags: [Management]
      summary: Issue a push enrollment token for a user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Enrollment token

  /api/webhooks/{id}:
    get:
      tags: [Management]
      summary: Get one webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Webhook
    patch:
      tags: [Management]
      summary: Update a webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated webhook
    delete:
      tags: [Management]
      summary: Delete a webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/webhooks/{id}/test:
    post:
      tags: [Management]
      summary: Send a test webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Delivered

  /api/refresh-tokens/{id}/revoke:
    post:
      tags: [Management]
      summary: Revoke a refresh token by id
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked

  /api/audit:
    get:
      tags: [Management]
      summary: List audit log rows
      description: Requires a management client-credentials token. `window` uses the same duration rules as login analytics. Metadata omits passwords, tokens, reset links, client secrets, and captcha secrets.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: window
          in: query
          schema: { type: string, example: 720h }
        - name: action
          in: query
          schema: { type: string, example: client.create }
        - name: actor_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Audit rows
        "403":
          description: A user token cannot read the audit log

  /api/keys/rotate:
    post:
      tags: [Management]
      summary: Rotate signing keys
      description: Creates a new active RSA key and a new active EC key. The previous keys stay in JWKS until `retire_at`. Private key material is not returned.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Public key ids now published

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque OAuth 2.0 access token. Management routes require a client-credentials token whose scope contains management.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with client_id:client_secret

  schemas:
    # ── DCR (Dynamic Client Registration) ──

    DCRRequest:
      type: object
      required: [client_name, redirect_uris]
      description: Request body for Dynamic Client Registration (RFC 7591)
      example:
        client_name: "My Web App"
        redirect_uris: ["https://example.com/callback"]
        grant_types: ["authorization_code", "client_credentials"]
        scope: "openid profile email"
      properties:
        client_name:
          type: string
          description: Human-readable name of the client application
          example: "My Web App"
        redirect_uris:
          type: array
          items:
            type: string
          description: Registered redirect URIs (must be HTTPS or http://localhost)
          example: ["https://example.com/callback"]
        grant_types:
          type: array
          items:
            type: string
          description: 'Requested grant types. Default: ["authorization_code"]'
          example: ["authorization_code", "client_credentials"]
        response_types:
          type: array
          items:
            type: string
          description: 'Requested response types. Default: ["code"]'
          example: ["code"]
        scope:
          type: string
          description: Space-separated list of requested scopes
          example: "openid profile email"
        token_endpoint_auth_method:
          type: string
          description: "Client authentication method. Default: client_secret_basic"
          example: "client_secret_basic"
        dpop_bound_access_tokens:
          type: boolean
          description: Forced DPoP for this OAuth app. When true, every token grant, UserInfo call, and revocation of a bound token requires a DPoP proof, even if security.dpop.enabled is false.
          example: false
        require_pushed_authorization_requests:
          type: boolean
          description: Whether the client must use PAR for authorization requests
          example: false
        backchannel_token_delivery_mode:
          type: string
          enum: [poll, ping, push]
          description: CIBA token delivery mode
        backchannel_client_notification_endpoint:
          type: string
          description: Callback URL for CIBA ping/push mode
          example: "https://example.com/ciba/callback"

    DCRResponse:
      type: object
      description: Response from Dynamic Client Registration
      example:
        client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        client_secret: "s3cr3t-k3y-h3r3-4nd-l0ng3r-th4n-th1s"
        client_id_issued_at: 1718000000
        client_secret_expires_at: 0
        redirect_uris: ["https://example.com/callback"]
        token_endpoint_auth_method: "client_secret_basic"
        grant_types: ["authorization_code", "client_credentials"]
        response_types: ["code"]
        client_name: "My Web App"
        scope: "openid profile email"
      properties:
        client_id:
          type: string
          description: Unique client identifier
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        client_secret:
          type: string
          description: Client secret (store securely, not recoverable)
          example: "s3cr3t-k3y-h3r3-4nd-l0ng3r-th4n-th1s"
        client_id_issued_at:
          type: integer
          description: Unix timestamp when client_id was issued
          example: 1718000000
        client_secret_expires_at:
          type: integer
          description: "Unix timestamp when secret expires. 0 = no expiration"
          example: 0
        redirect_uris:
          type: array
          items:
            type: string
          description: Registered redirect URIs
          example: ["https://example.com/callback"]
        token_endpoint_auth_method:
          type: string
          description: How the client authenticates at the token endpoint
          example: "client_secret_basic"
        grant_types:
          type: array
          items:
            type: string
          description: Allowed grant types
          example: ["authorization_code", "client_credentials"]
        response_types:
          type: array
          items:
            type: string
          description: Allowed response types
          example: ["code"]
        client_name:
          type: string
          description: Client application name
          example: "My Web App"
        scope:
          type: string
          description: Space-separated allowed scopes
          example: "openid profile email"

    # ── Management Client Create ──

    ManagementClientCreate:
      type: object
      required: [name]
      description: >
        Request body for creating a client via the management API.
        Set id when a config file must name the client. Omit id and the
        server generates one.
      example:
        name: "My Web App"
        redirect_uris: ["https://example.com/callback"]
        grant_types:
          ["authorization_code", "client_credentials", "refresh_token"]
        scopes: ["openid", "profile", "email"]
        token_endpoint_auth_method: "client_secret_basic"
      properties:
        id:
          type: string
          description: Client identifier. Omit it and the server generates one.
          example: "field-notes"
        name:
          type: string
          description: Client application name (required)
          example: "My Web App"
        redirect_uris:
          type: array
          items:
            type: string
          description: Registered redirect URIs
          example: ["https://example.com/callback"]
        grant_types:
          type: array
          items:
            type: string
          description: Allowed grant types
          example: ["authorization_code", "client_credentials", "refresh_token"]
        scopes:
          type: array
          items:
            type: string
          description: Allowed scopes as an array (not space-separated like DCR)
          example: ["openid", "profile", "email"]
        token_endpoint_auth_method:
          type: string
          description: "Client authentication method. Default: client_secret_basic"
          example: "client_secret_basic"
        dpop_bound_access_tokens:
          type: boolean
          description: Whether the client always uses DPoP
          example: false
        require_pushed_authorization_requests:
          type: boolean
          description: Whether the client must use PAR
          example: false
        backchannel_token_delivery_mode:
          type: string
          enum: [poll, ping, push]
          description: CIBA token delivery mode
        backchannel_client_notification_endpoint:
          type: string
          description: Callback URL for CIBA ping/push mode
        backchannel_authentication_request_signing_alg:
          type: string
          description: Algorithm for signing CIBA authentication requests

    # ── Client (response) ──

    Client:
      type: object
      description: OAuth client representation
      example:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        secret: "s3cr3t-k3y-h3r3-4nd-l0ng3r-th4n-th1s"
        name: "My Web App"
        redirect_uris: ["https://example.com/callback"]
        grant_types: ["authorization_code", "client_credentials"]
        scopes: ["openid", "profile"]
        token_endpoint_auth_method: "client_secret_basic"
        dpop_bound_access_tokens: false
        require_pushed_authorization_requests: false
        backchannel_token_delivery_mode: null
        backchannel_client_notification_endpoint: null
        backchannel_authentication_request_signing_alg: null
        created_at: "2026-06-16T10:00:00Z"
        updated_at: "2026-06-16T10:00:00Z"
      properties:
        id:
          type: string
          description: Unique client identifier
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        secret:
          type: string
          description: Client secret (included in responses, store securely)
          example: "s3cr3t-k3y-h3r3-4nd-l0ng3r-th4n-th1s"
        name:
          type: string
          description: Client application name
          example: "My Web App"
        redirect_uris:
          type: array
          items:
            type: string
          description: Registered redirect URIs
          example: ["https://example.com/callback"]
        grant_types:
          type: array
          items:
            type: string
          description: Allowed grant types
          example: ["authorization_code", "client_credentials"]
        scopes:
          type: array
          items:
            type: string
          description: Allowed scopes
          example: ["openid", "profile"]
        token_endpoint_auth_method:
          type: string
          description: Client authentication method at token endpoint
          example: "client_secret_basic"
        dpop_bound_access_tokens:
          type: boolean
          description: Whether client always uses DPoP-bound tokens
          example: false
        require_pushed_authorization_requests:
          type: boolean
          description: Whether client must use PAR
          example: false
        backchannel_token_delivery_mode:
          type: string
          description: CIBA delivery mode (poll, ping, push, or null)
        backchannel_client_notification_endpoint:
          type: string
          description: CIBA callback URL (null if not using ping/push)
        backchannel_authentication_request_signing_alg:
          type: string
          description: CIBA request signing algorithm
        created_at:
          type: string
          format: date-time
          description: Client creation timestamp
          example: "2026-06-16T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-06-16T10:00:00Z"

    # ── User ──

    CreateUserRequest:
      type: object
      required: [username, password]
      description: Request body for creating a user
      example:
        username: "johndoe"
        password: "secureP@ss123"
        email: "john@example.com"
        phone_number: "+1-555-123-4567"
      properties:
        username:
          type: string
          description: Unique username
          example: "johndoe"
        password:
          type: string
          format: password
          description: User password (stored with the hasher in internal/hashalgo/algo.go)
          example: "secureP@ss123"
        email:
          type: string
          format: email
          description: User email address
          example: "john@example.com"
        phone_number:
          type: string
          description: User phone number (E.164 format recommended)
          example: "+1-555-123-4567"

    User:
      type: object
      description: User representation (password hash is never returned)
      example:
        id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        username: "johndoe"
        email: "john@example.com"
        phone_number: "+1-555-123-4567"
        created_at: "2026-06-16T10:00:00Z"
      properties:
        id:
          type: string
          description: Unique user identifier
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        username:
          type: string
          description: Username
          example: "johndoe"
        email:
          type: string
          description: Email address
          example: "john@example.com"
        phone_number:
          type: string
          description: Phone number
          example: "+1-555-123-4567"
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2026-06-16T10:00:00Z"

    # ── Token ──

    TokenResponse:
      type: object
      description: Successful token response
      example:
        access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type: "Bearer"
        expires_in: 3600
        refresh_token: "tGzv3JOkF0XG5Qx2TlKWIA"
        scope: "openid profile"
        id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      properties:
        access_token:
          type: string
          description: The access token (opaque string or JWT)
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          description: "Token type: Bearer (standard) or DPoP (proof-of-possession)"
          example: "Bearer"
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 3600
        refresh_token:
          type: string
          description: Refresh token (for refresh_token grant, not always present)
          example: "tGzv3JOkF0XG5Qx2TlKWIA"
        scope:
          type: string
          description: Space-separated granted scopes (may be less than requested)
          example: "openid profile"
        id_token:
          type: string
          description: OpenID Connect ID token (only when openid scope is granted)
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

    AccessToken:
      type: object
      description: Access token representation (for listing/introspection)
      example:
        token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        scopes: ["openid", "profile"]
        token_type: "Bearer"
        dpop_jkt: null
        expires_at: "2026-06-16T11:00:00Z"
        revoked: false
      properties:
        token:
          type: string
          description: The access token value
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        client_id:
          type: string
          description: Client that requested the token
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_id:
          type: string
          description: User who authorized the token (null for client_credentials)
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        scopes:
          type: array
          items:
            type: string
          description: Granted scopes
          example: ["openid", "profile"]
        token_type:
          type: string
          description: "Bearer or DPoP"
          example: "Bearer"
        dpop_jkt:
          type: string
          description: DPoP JWK thumbprint (null for Bearer tokens)
        expires_at:
          type: string
          format: date-time
          description: Token expiration timestamp
          example: "2026-06-16T11:00:00Z"
        revoked:
          type: boolean
          description: Whether the token has been revoked
          example: false

    IntrospectionResponse:
      type: object
      description: Token introspection response (RFC 7662)
      example:
        active: true
        scope: "openid profile"
        client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        username: "johndoe"
        token_type: "Bearer"
        exp: 1718003600
        iat: 1718000000
        sub: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      properties:
        active:
          type: boolean
          description: Whether the token is currently active
          example: true
        scope:
          type: string
          description: Space-separated granted scopes
          example: "openid profile"
        client_id:
          type: string
          description: Client that requested the token
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        username:
          type: string
          description: Username of the resource owner
          example: "johndoe"
        token_type:
          type: string
          description: Token type
          example: "Bearer"
        exp:
          type: integer
          description: Expiration time (Unix timestamp)
          example: 1718003600
        iat:
          type: integer
          description: Issuance time (Unix timestamp)
          example: 1718000000
        sub:
          type: string
          description: Subject identifier for this client
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        iss:
          type: string
          description: Issuer identifier
        aud:
          type: string
          description: Resource indicator when the token has one, otherwise the client id
        nbf:
          type: integer
          description: Not-before time (Unix timestamp)
        jti:
          type: string
          description: Token identifier when the token has one
        org_id:
          type: string
          description: Organization id when the token was issued for an organization
        act:
          type: object
          description: Actor claim for delegation or impersonation (RFC 8693)
          additionalProperties: true

    # ── Device ──

    DeviceAuthorizationResponse:
      type: object
      description: Device authorization response (RFC 8628)
      example:
        device_code: "GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS"
        user_code: "WDJB-MJHT"
        verification_uri: "http://localhost:8080/device"
        verification_uri_complete: "http://localhost:8080/device?user_code=WDJB-MJHT"
        expires_in: 1800
        interval: 5
      properties:
        device_code:
          type: string
          description: Device verification code (used for polling, not shown to user)
          example: "GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS"
        user_code:
          type: string
          description: "User code (shown to user, e.g. WDJB-MJHT)"
          example: "WDJB-MJHT"
        verification_uri:
          type: string
          description: URL where user enters the user_code
          example: "http://localhost:8080/device"
        verification_uri_complete:
          type: string
          description: URL with user_code pre-filled (can show as QR code)
          example: "http://localhost:8080/device?user_code=WDJB-MJHT"
        expires_in:
          type: integer
          description: Lifetime of device_code and user_code in seconds
          example: 1800
        interval:
          type: integer
          description: Minimum polling interval in seconds
          example: 5

    # ── PAR ──

    PARResponse:
      type: object
      description: Pushed Authorization Request response (RFC 9126)
      example:
        request_uri: "urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c"
        expires_in: 60
      properties:
        request_uri:
          type: string
          description: "Request URI to use in /oauth/authorize (single-use, bound to client)"
          example: "urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c"
        expires_in:
          type: integer
          description: Lifetime of the request_uri in seconds
          example: 60

    # ── CIBA ──

    CIBAResponse:
      type: object
      description: CIBA backchannel authentication response
      example:
        auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
        expires_in: 120
        interval: 5
      properties:
        auth_req_id:
          type: string
          description: Unique identifier for the authentication request (use for polling)
          example: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
        expires_in:
          type: integer
          description: Lifetime of the auth_req_id in seconds
          example: 120
        interval:
          type: integer
          description: Minimum polling interval in seconds
          example: 5

    CIBARequest:
      type: object
      description: CIBA request representation
      example:
        auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
        client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        binding_message: "Approve login from Smart TV"
        user_code: null
        status: "pending"
        delivery_mode: "poll"
        expires_at: "2026-06-16T10:02:00Z"
        interval: 5
      properties:
        auth_req_id:
          type: string
          description: Unique authentication request identifier
          example: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
        client_id:
          type: string
          description: Client that initiated the request
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_id:
          type: string
          description: User being authenticated
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        binding_message:
          type: string
          description: Human-readable message shown on auth device
          example: "Approve login from Smart TV"
        user_code:
          type: string
          description: User code (if user_code parameter was used)
        status:
          type: string
          enum: [pending, approved, denied, expired]
          description: Current status of the request
          example: "pending"
        delivery_mode:
          type: string
          enum: [poll, ping, push]
          description: How tokens will be delivered
          example: "poll"
        expires_at:
          type: string
          format: date-time
          description: Request expiration timestamp
          example: "2026-06-16T10:02:00Z"
        interval:
          type: integer
          description: Minimum polling interval in seconds
          example: 5

    # ── Scope ──

    CreateScopeRequest:
      type: object
      required: [name]
      description: Request body for creating a scope
      example:
        name: "read"
        description: "Read access to resources"
        resource_server: "https://api.example.com"
        is_default: false
      properties:
        name:
          type: string
          description: Scope name (must be unique)
          example: "read"
        description:
          type: string
          description: Human-readable description of the scope
          example: "Read access to resources"
        resource_server:
          type: string
          description: Resource server URI this scope belongs to (null for system scopes)
          example: "https://api.example.com"
        is_default:
          type: boolean
          description: Whether this scope is automatically granted to new clients
          example: false

    Scope:
      type: object
      description: OAuth scope definition
      example:
        name: "read"
        description: "Read access to resources"
        resource_server: "https://api.example.com"
        is_default: false
        created_at: "2026-06-16T10:00:00Z"
      properties:
        name:
          type: string
          description: Unique scope name
          example: "read"
        description:
          type: string
          description: Human-readable description
          example: "Read access to resources"
        resource_server:
          type: string
          description: Associated resource server URI (null for system scopes)
          example: "https://api.example.com"
        is_default:
          type: boolean
          description: Whether this is a default scope
          example: false
        created_at:
          type: string
          format: date-time
          description: Scope creation timestamp
          example: "2026-06-16T10:00:00Z"

    # ── Resource (RFC 8707) ──

    CreateResourceRequest:
      type: object
      required: [uri, name]
      description: Request body for registering a resource server
      example:
        uri: "https://api.example.com"
        name: "Example API"
        description: "Main API server"
        scopes: ["read", "write", "admin"]
      properties:
        uri:
          type: string
          description: Resource server URI (must be unique, HTTPS recommended)
          example: "https://api.example.com"
        name:
          type: string
          description: Human-readable resource name
          example: "Example API"
        description:
          type: string
          description: Resource server description
          example: "Main API server"
        scopes:
          type: array
          items:
            type: string
          description: Allowed scopes for this resource
          example: ["read", "write", "admin"]

    UpdateResourceRequest:
      type: object
      description: Request body for updating a resource server
      example:
        name: "Updated API Name"
        description: "Updated description"
        scopes: ["read", "write", "admin", "delete"]
      properties:
        name:
          type: string
          description: Resource name
          example: "Updated API Name"
        description:
          type: string
          description: Resource description
          example: "Updated description"
        scopes:
          type: array
          items:
            type: string
          description: Allowed scopes
          example: ["read", "write", "admin", "delete"]

    Resource:
      type: object
      description: Resource server representation (RFC 8707)
      example:
        uri: "https://api.example.com"
        name: "Example API"
        description: "Main API server"
        scopes: ["read", "write", "admin"]
        created_at: "2026-06-16T10:00:00Z"
      properties:
        uri:
          type: string
          description: Resource server URI (used as audience in tokens)
          example: "https://api.example.com"
        name:
          type: string
          description: Human-readable resource name
          example: "Example API"
        description:
          type: string
          description: Resource description
          example: "Main API server"
        scopes:
          type: array
          items:
            type: string
          description: Allowed scopes for this resource
          example: ["read", "write", "admin"]
        created_at:
          type: string
          format: date-time
          description: Registration timestamp
          example: "2026-06-16T10:00:00Z"

    # ── Consent ──

    Consent:
      type: object
      description: User consent record
      example:
        id: "c1o2n3s4-e5n6-t789-abcd-ef1234567890"
        user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        scopes: ["openid", "profile", "email"]
        granted_at: "2026-06-16T10:00:00Z"
      properties:
        id:
          type: string
          description: Unique consent identifier
          example: "c1o2n3s4-e5n6-t789-abcd-ef1234567890"
        user_id:
          type: string
          description: User who granted consent
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        client_id:
          type: string
          description: Client that received consent
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        scopes:
          type: array
          items:
            type: string
          description: Granted scopes
          example: ["openid", "profile", "email"]
        granted_at:
          type: string
          format: date-time
          description: When consent was granted
          example: "2026-06-16T10:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: When consent expires (null for no expiration)

    # ── OIDC ──

    OIDCDiscovery:
      type: object
      description: OpenID Connect Discovery / OAuth Authorization Server Metadata
      properties:
        issuer:
          type: string
          description: Issuer identifier URL
          example: "http://localhost:8080"
        authorization_endpoint:
          type: string
          description: URL of the authorization endpoint
          example: "http://localhost:8080/oauth/authorize"
        token_endpoint:
          type: string
          description: URL of the token endpoint
          example: "http://localhost:8080/oauth/token"
        userinfo_endpoint:
          type: string
          description: URL of the UserInfo endpoint
          example: "http://localhost:8080/oidc/userinfo"
        jwks_uri:
          type: string
          description: URL of the JWKS endpoint
          example: "http://localhost:8080/oidc/jwks"
        registration_endpoint:
          type: string
          description: URL for dynamic client registration
          example: "http://localhost:8080/oauth/register"
        revocation_endpoint:
          type: string
          description: URL of the token revocation endpoint
          example: "http://localhost:8080/oauth/revoke"
        introspection_endpoint:
          type: string
          description: URL of the token introspection endpoint
          example: "http://localhost:8080/oauth/introspect"
        device_authorization_endpoint:
          type: string
          description: URL of the device authorization endpoint
          example: "http://localhost:8080/oauth/device"
        pushed_authorization_request_endpoint:
          type: string
          description: URL of the PAR endpoint
          example: "http://localhost:8080/oauth/par"
        backchannel_authentication_endpoint:
          type: string
          description: URL of the CIBA backchannel authentication endpoint
          example: "http://localhost:8080/oauth/bc-authorize"
        scopes_supported:
          type: array
          items:
            type: string
          description: Supported scopes
          example:
            ["openid", "profile", "email", "address", "phone", "offline_access"]
        response_types_supported:
          type: array
          items:
            type: string
          description: Supported response types
          example:
            [
              "code",
              "token",
              "id_token",
              "code id_token",
              "code token",
              "code id_token token",
              "none",
            ]
        response_modes_supported:
          type: array
          items:
            type: string
          description: Supported response modes
          example: ["query", "fragment"]
        grant_types_supported:
          type: array
          items:
            type: string
          description: Supported grant types
          example:
            [
              "authorization_code",
              "client_credentials",
              "refresh_token",
              "urn:ietf:params:oauth:grant-type:device_code",
              "urn:openid:params:grant-type:ciba",
            ]
        authorization_grant_profiles_supported:
          type: array
          items:
            type: string
          description: >
            Present only when xaa.enabled is true. Lists
            urn:ietf:params:oauth:grant-profile:id-jag.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Supported client authentication methods
          example:
            [
              "client_secret_basic",
              "client_secret_post",
              "client_secret_jwt",
              "private_key_jwt",
              "none",
            ]
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Supported signing algorithms for client authentication
          example: ["RS256", "ES256"]
        subject_types_supported:
          type: array
          items:
            type: string
          description: Supported subject identifier types
          example: ["public"]
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Supported ID token signing algorithms
          example: ["RS256", "ES256"]
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: Supported PKCE code challenge methods
          example: ["S256", "plain"]
        claims_supported:
          type: array
          items:
            type: string
          description: Supported claims in ID tokens and UserInfo
          example:
            [
              "sub",
              "name",
              "given_name",
              "family_name",
              "preferred_username",
              "email",
              "email_verified",
              "phone_number",
              "picture",
              "locale",
              "updated_at",
            ]
        claims_parameter_supported:
          type: boolean
          description: Whether the claims parameter is supported
          example: true
        request_parameter_supported:
          type: boolean
          description: Whether the request parameter is supported
          example: true
        request_uri_parameter_supported:
          type: boolean
          description: Whether the request_uri parameter is supported
          example: true
        require_pushed_authorization_requests:
          type: boolean
          description: Whether PAR is required for all clients
          example: false
        backchannel_token_delivery_modes_supported:
          type: array
          items:
            type: string
          description: Supported CIBA token delivery modes
          example: ["poll"]
        backchannel_user_code_parameter_supported:
          type: boolean
          description: Whether CIBA user_code parameter is supported
          example: false
        dpop_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Supported DPoP signing algorithms
          example: ["ES256"]

    JWKS:
      type: object
      description: JSON Web Key Set
      example:
        keys:
          - kty: "RSA"
            kid: "r1k2e3y4"
            use: "sig"
            alg: "RS256"
            n: "0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM..."
            e: "AQAB"
          - kty: "EC"
            kid: "e1c2k3e4y"
            use: "sig"
            alg: "ES256"
            crv: "P-256"
            x: "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU"
            y: "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"
      properties:
        keys:
          type: array
          description: Array of public keys
          items:
            type: object
            properties:
              kty:
                type: string
                description: "Key type (RSA or EC)"
                example: "RSA"
              kid:
                type: string
                description: Key ID (matches kid in JWT headers)
                example: "r1k2e3y4"
              use:
                type: string
                description: "Key usage (sig for signing)"
                example: "sig"
              alg:
                type: string
                description: "Algorithm (RS256, ES256)"
                example: "RS256"
              n:
                type: string
                description: RSA modulus (base64url-encoded)
                example: "0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM..."
              e:
                type: string
                description: RSA exponent (base64url-encoded)
                example: "AQAB"
              crv:
                type: string
                description: "EC curve (P-256, P-384, P-521)"
                example: "P-256"
              x:
                type: string
                description: EC X coordinate (base64url-encoded)
                example: "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU"
              y:
                type: string
                description: EC Y coordinate (base64url-encoded)
                example: "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"

    UserInfo:
      type: object
      description: OpenID Connect UserInfo response
      example:
        sub: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        name: "johndoe"
        preferred_username: "johndoe"
        given_name: "John"
        family_name: "Doe"
        email: "john@example.com"
        email_verified: true
        phone_number: "+1-555-123-4567"
        phone_number_verified: true
        picture: "https://example.com/johndoe/photo.jpg"
        locale: "en-US"
        updated_at: 1718000000
      properties:
        sub:
          type: string
          description: Subject identifier (unique user ID)
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        name:
          type: string
          description: Full name (from profile scope)
          example: "johndoe"
        preferred_username:
          type: string
          description: Preferred username (from profile scope)
          example: "johndoe"
        given_name:
          type: string
          description: First name (from profile scope)
          example: "John"
        family_name:
          type: string
          description: Last name (from profile scope)
          example: "Doe"
        email:
          type: string
          description: Email address (from email scope)
          example: "john@example.com"
        email_verified:
          type: boolean
          description: Whether email is verified (from email scope)
          example: true
        phone_number:
          type: string
          description: Phone number (from phone scope)
          example: "+1-555-123-4567"
        phone_number_verified:
          type: boolean
          description: Whether phone number is verified (from phone scope)
          example: true
        picture:
          type: string
          description: Profile picture URL (from profile scope)
          example: "https://example.com/johndoe/photo.jpg"
        locale:
          type: string
          description: User locale (from profile scope)
          example: "en-US"
        updated_at:
          type: integer
          description: Last profile update (Unix timestamp, from profile scope)
          example: 1718000000

    OAuthError:
      type: object
      required: [error]
      description: OAuth 2.0 error response
      example:
        error: invalid_request
        error_description: "client_id is required"
      properties:
        error:
          type: string
          description: Error code
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - access_denied
            - server_error
            - invalid_token
            - invalid_dpop_proof
            - expired_token
            - authorization_pending
            - slow_down
            - invalid_redirect_uri
          example: invalid_request
        error_description:
          type: string
          description: Human-readable error description
          example: "client_id is required"
        state:
          type: string
          description: State parameter from the original request (echoed back)
          example: "abc123xyz"
