        "200":
          description: Password updated
        "400":
          description: Current password is wrong or the new password fails complexity (`invalid_password`)

  /api/me/email/send:
    post:
      tags: [CIAM]
      summary: Send another email confirmation
      security: [{ bearerAuth: [] }]
