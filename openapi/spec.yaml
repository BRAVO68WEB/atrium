      tags: [Management]
      summary: Revoke a user's browser session
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
        - name: sid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked

  /api/users/{userID}/activity:
    get:
      tags: [Management]
      summary: Login activity for one user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Login events

  /api/users/{userID}/login-analytics:
    get:
      tags: [Management]
      summary: Login analytics for one user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
