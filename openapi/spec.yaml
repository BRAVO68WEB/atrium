        "200":
          description: Enrollment secret

  /api/users/{userID}/mfa/verify:
    post:
      tags: [Management]
      summary: Confirm a TOTP code for a user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
