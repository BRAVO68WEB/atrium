        "404":
          description: Session not found

  /api/me/refresh-tokens:
    get:
      tags: [CIAM]
      summary: List the current user's refresh tokens
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Refresh tokens, without the secret

  /api/me/refresh-tokens/{id}:
    delete:
      tags: [CIAM]
      summary: Revoke one refresh token
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refresh token revoked

  /api/me/activity:
    get:
      tags: [CIAM]
      summary: Recent login activity for the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Login events

  /api/users/{userID}/password:
    post:
      tags: [Management]
      summary: Set a user's password
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password updated
        "400":
          description: Password fails complexity (`invalid_password`)

  /api/users/{userID}/sessions:
    get:
      tags: [Management]
      summary: List a user's browser sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sessions

  /api/users/{userID}/sessions/{sid}:
