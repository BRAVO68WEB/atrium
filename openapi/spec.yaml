openapi: 3.1.0
info:
  title: Atrium
  description: |
    Atrium is a self-hosted identity server for OAuth 2.0 and OpenID Connect.

    Supports: Authorization Code + PKCE, Client Credentials, Device Code (RFC 8628),
    CIBA (Client-Initiated Backchannel Authentication), PAR (RFC 9126), DPoP (RFC 9449),
    Token Introspection (RFC 7662), Token Revocation (RFC 7009), Dynamic Client Registration (RFC 7591),
    Resource Indicators (RFC 8707), OIDC Discovery, JWKS, UserInfo, TOTP-based MFA,
    Consent Management, Custom Scopes, and login_hint/prompt/max_age parameters.
  version: 1.1.0
  contact:
    name: API Support
    url: https://github.com/bravo68web/atrium

servers:
  - url: https://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints
  - name: OAuth 2.0
    description: OAuth 2.0 protocol endpoints as defined in RFC 6749 and extensions
  - name: OIDC
    description: OpenID Connect endpoints for identity and discovery
  - name: Management
    description: Administrative API for managing clients, users, and tokens
  - name: Scopes
    description: Custom scope management for defining and organizing OAuth scopes
  - name: Resources
    description: Resource server management for RFC 8707 Resource Indicators
  - name: Consents
    description: User consent management for tracking authorization grants
  - name: CIBA
    description: Client-Initiated Backchannel Authentication (CIBA) for decoupled flows
  - name: Device
    description: Device Authorization Grant (RFC 8628) for input-constrained devices
  - name: CIAM
    description: Self-service profile, password, session, and activity APIs for a user access token
  - name: Branding
    description: Public files for the auth pages
  - name: Social
    description: Browser sign-in through an upstream OAuth app

paths:
  # ──────────────────────────────────────────────
  # Health
  # ──────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Health check
      description: |
        Returns the server health status. Use this endpoint to verify the server is running and responsive.
        Returns HTTP 200 with `{"status":"ok"}` when healthy.
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Server status
                    example: ok
              example:
                status: ok

  /version:
    get:
      tags: [Health]
      summary: Build version
      description: |
        Returns the build version. No token is required.
        A local build returns `{"version":"dev"}`. A release build
        also returns `commit` and `date`.
      operationId: buildVersion
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    description: Release version, or dev for a local build
                    example: dev
                  commit:
                    type: string
                    description: Git commit recorded at build time
                  date:
                    type: string
                    description: UTC build time
              example:
                version: dev

  /login/social/{provider}:
    get:
      tags: [Social]
      summary: Start social login
      description: Redirects to the enabled provider. The query string carries the downstream OAuth request.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the upstream authorization endpoint
        "404":
          description: Provider is not enabled
  /login/social/{provider}/callback:
    get:
      tags: [Social]
      summary: Finish social login
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        "302":
          description: Browser session started
        "403":
          description: Social registration is disabled and this provider account is not linked

  /branding/assets/{name}:
    get:
      tags: [Branding]
      summary: Branding asset
      description: |
        Serves one file from `branding.assets_dir`. `name` is a single path segment whose extension is png, jpg, jpeg, gif, webp, svg, ico, or css. Files larger than 1 MiB are rejected.
      operationId: getBrandingAsset
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown name, or branding assets are not configured
        "413":
          description: File is larger than 1 MiB

  /oauth/logout:
    get:
      tags: [OIDC]
      summary: RP-Initiated Logout
      description: Ends the browser session. A valid id_token_hint logs out without a prompt. Otherwise the response is a confirmation page.
      parameters:
        - in: query
          name: id_token_hint
          schema: { type: string }
        - in: query
          name: client_id
          schema: { type: string }
        - in: query
          name: post_logout_redirect_uri
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        "200":
          description: Logged out, or a confirmation page
        "302":
          description: Redirect to a registered post_logout_redirect_uri
    post:
      tags: [OIDC]
      summary: Confirm RP-Initiated Logout
      responses:
        "200":
          description: Logged out

  /api/me:
    get:
      tags: [CIAM]
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile for the access token subject
    patch:
      tags: [CIAM]
      summary: Update the current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated profile

  /api/me/consents:
    get:
      tags: [CIAM]
      summary: Applications this user has authorized
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Consent grants for the access token subject

  /api/me/consents/{clientID}:
    delete:
      tags: [CIAM]
      summary: Remove one application's access
      description: Deletes the consent and revokes that client's access and refresh tokens for this user.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clientID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consent and tokens revoked

  /api/account/register:
    post:
      tags: [CIAM]
      summary: Self-service registration
      description: Returns 403 `registration_disabled` when `security.disable_registration` is true. Management `POST /api/users` is not affected.
      responses:
        "201":
          description: User created. Email is unverified until the confirmation link is used.
        "403":
          description: Self-service registration is disabled

  /api/account/password/forgot:
    post:
      tags: [CIAM]
      summary: Request a password reset email
      responses:
        "200":
          description: Accepted. The response is the same when the account does not exist.
        "503":
          description: SMTP is not configured

  /api/account/password/reset:
    post:
      tags: [CIAM]
      summary: Set a password with a reset token
      responses:
        "200":
          description: Password updated

  /api/me/login-analytics:
    get:
      tags: [CIAM]
      summary: Login behavior for the current user
      description: Counts attempts, failure rate, unique IPs, addresses first seen in the window, and daily totals. `window` is a Go duration such as `168h`. The default is `720h`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: window
          schema: { type: string, example: 168h }
      responses:
        "200":
          description: Login analytics

  /api/analytics/logins:
    get:
      tags: [Management]
      summary: Login behavior across users
      description: Requires a management client-credentials token. Groups attempts by IP and day.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: window
          schema: { type: string, example: 720h }
      responses:
        "200":
          description: Login analytics

  /api/orgs:
    get:
      tags: [Management]
      summary: List organizations
      description: Requires `org.enabled`. A management client bound to an organization receives only that organization.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organizations
        "403":
          description: Organizations are disabled or the token is not a management client
    post:
      tags: [Management]
      summary: Create an organization
      description: |
        Body is `name`, `slug`, optional `domains`, and optional `logo_url`
        (an absolute http or https URL). A management client bound
        to an organization cannot create another organization.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created organization
        "400":
          description: Invalid name, slug, or domain
        "403":
          description: Organizations are disabled or the client cannot create organizations

  /api/orgs/{orgID}:
    get:
      tags: [Management]
      summary: Get an organization
      description: "`orgID` is the organization id or slug."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orgID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization
        "403":
          description: The management client is limited to a different organization
        "404":
          description: Organization not found

  /api/orgs/{orgID}/domains:
    post:
      tags: [Management]
      summary: Add an email domain to an organization
      description: Body is `domain`, a bare hostname. A bound organization client cannot change domains.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orgID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization including the new domain
        "400":
          description: Invalid domain
        "403":
          description: The client cannot change domains

  /api/orgs/{orgID}/members:
    post:
      tags: [Management]
      summary: Add a user to an organization
      description: Body is `user_id` and optional `role` (`member` or `admin`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orgID
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Membership created
        "400":
          description: Missing user or invalid role
        "404":
          description: Organization not found

  /api/webhooks:
    get:
      tags: [Management]
      summary: List webhooks
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Webhook subscriptions
    post:
      tags: [Management]
      summary: Create a webhook
      description: |
        `events` chooses which triggers are delivered. Use `["*"]` for every event.
        Known events include login, login_failed, logout, sso_session_triggered,
        bruteforce_detected, forgot_password, change_password, password_reset,
        user_registered, email_verified, and user_disabled.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created, including the signing secret

  /api/refresh-tokens:
    get:
      tags: [Management]
      summary: List refresh tokens
      description: Requires a client-credentials access token with the management scope. Entries use a public id and omit the secret.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Refresh token list
        "401":
          description: Missing or invalid token

  # ──────────────────────────────────────────────
  # OAuth 2.0 Endpoints
  # ──────────────────────────────────────────────

  /oauth/register:
    post:
      tags: [OAuth 2.0]
      summary: Dynamic Client Registration (RFC 7591)
      description: |
        Register a new OAuth 2.0 client dynamically. Returns client credentials including
        `client_id` and `client_secret`. The client can then be used with any supported grant type.

        See [RFC 7591](https://datatracker.ietf.org/doc/html/rfc7591) for details.
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DCRRequest"
            example:
              client_name: "My Web App"
              redirect_uris: ["https://example.com/callback"]
              grant_types: ["authorization_code", "client_credentials"]
              scope: "openid profile email"
      responses:
        "201":
          description: Client registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DCRResponse"
              example:
                client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                client_secret: "s3cr3t-k3y-h3r3-4nd-l0ng3r-th4n-th1s"
                client_id_issued_at: 1718000000
                client_secret_expires_at: 0
                redirect_uris: ["https://example.com/callback"]
                token_endpoint_auth_method: "client_secret_basic"
                grant_types: ["authorization_code", "client_credentials"]
                response_types: ["code"]
                client_name: "My Web App"
                scope: "openid profile email"
        "400":
          description: Invalid request (missing required fields or invalid redirect URI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: "client_name is required"

  /oauth/authorize:
    get:
      tags: [OAuth 2.0]
      summary: Authorization endpoint
      description: |
        Initiates the OAuth 2.0 authorization flow. The user-agent is redirected to this endpoint
        to authenticate the user and obtain consent. On success, redirects back to the client
        with an authorization code.

        When `redirect_uri` is `urn:ietf:wg:oauth:2.0:oob` or `urn:ietf:wg:oauth:2.0:oob:auto`,
        and that value is registered for the client, the response is an HTML page containing
        the authorization code. That request requires `response_type=code` and PKCE S256.
        The token request repeats the same redirect URI.

        Supports PKCE via `code_challenge` and `code_challenge_method` parameters.

        When `security.oob_helper` is true, `GET /oauth/oob` displays the combined
        code from draft-richer-oauth-oob-authcode after a normal redirect to that URI.

        `requested_actor` names a registered agent client. That request requires
        PKCE S256. The user consents to that agent, and the token request
        includes `actor_token`, an access token already issued to the agent.
        The resulting access token is a JWT with an `act` claim.
      operationId: authorize
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The client identifier obtained from registration
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                code,
                token,
                id_token,
                "code id_token",
                "code token",
                "code id_token token",
                none,
              ]
          description: |
            OAuth response type:
            - `code`: Authorization code flow (query parameter)
            - `token`: Implicit access token (fragment)
            - `id_token`: Implicit ID token (fragment)
            - `code id_token`: Hybrid - code + ID token (fragment)
            - `code token`: Hybrid - code + access token (fragment)
            - `code id_token token`: Hybrid - all three (fragment)
            - `none`: No tokens returned
          example: code
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: Must match one of the registered redirect URIs
          example: "https://example.com/callback"
        - name: scope
          in: query
          schema:
            type: string
          description: Space-separated list of requested scopes
          example: "openid profile email"
        - name: state
          in: query
          schema:
            type: string
          description: Opaque value for CSRF protection (recommended)
          example: "abc123xyz"
        - name: code_challenge
          in: query
          schema:
            type: string
          description: PKCE code challenge (base64url-encoded SHA256 of code_verifier)
          example: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
        - name: code_challenge_method
          in: query
          schema:
            type: string
            enum: [S256, plain]
          description: PKCE challenge method (S256 recommended)
          example: S256
        - name: nonce
          in: query
          schema:
            type: string
          description: OpenID Connect nonce for replay protection
          example: "n-0S6_WzA2Mj"
        - name: prompt
          in: query
          schema:
            type: string
            enum: [none, login, consent, select_account]
          description: |
            OIDC prompt parameter:
            - `none`: No UI shown; fail if not already authenticated and consented
            - `login`: Force re-authentication even if already logged in
            - `consent`: Force consent screen even if previously consented
            - `select_account`: Account chooser (not yet implemented)
          example: consent
        - name: login_hint
          in: query
          schema:
            type: string
          description: Hint to pre-fill the username on the login page
          example: "johndoe"
        - name: resource
          in: query
          schema:
            type: string
          description: |
            Resource indicator (RFC 8707). The URI of the resource server the client wants to access.
            The issued token will be scoped to this resource.
          example: "https://api.example.com"
        - name: user_id
          in: query
          schema:
            type: string
          description: User ID for auto-approval (testing only, not part of standard OAuth)
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      responses:
        "200":
          description: |
            HTML page containing the authorization code when `redirect_uri` is
            `urn:ietf:wg:oauth:2.0:oob` or `urn:ietf:wg:oauth:2.0:oob:auto`.
        "302":
          description: |
            Redirect to client with authorization code. The `Location` header contains the
            redirect URI with `code` and `state` query parameters.
          headers:
            Location:
              description: Redirect URI with authorization code
              schema:
                type: string
                example: "https://example.com/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=abc123xyz"
        "400":
          description: Invalid request (missing parameters, invalid client, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: "client_id is required"
                state: "abc123xyz"

  /oauth/oob:
    get:
      tags: [OAuth 2.0]
      summary: Combined authorization code helper
      description: |
        Serves the combined-code page from draft-richer-oauth-oob-authcode.
        The route is always registered. It returns 404 unless `security.oob_helper`
        is true. A normal authorization redirect lands here with `code` and `state`.
        The page shows one combined value. An `error` query without `code` shows
        the error page. Missing `code` or `state` returns 400.
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Authorization code from the redirect
        - name: state
          in: query
          schema: { type: string }
          description: State from the authorization request
        - name: error
          in: query
          schema: { type: string }
          description: OAuth error code when authorization failed
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        "200":
          description: HTML page with the combined code, or the error page
        "400":
          description: code and state are required
        "404":
          description: security.oob_helper is false

  /oauth/token:
    post:
      tags: [OAuth 2.0]
      summary: Token endpoint
      description: |
        Exchanges an authorization grant for tokens. Supports multiple grant types:

        - **authorization_code**: Exchange an authorization code for tokens (requires `code`, `redirect_uri`, optionally `code_verifier`; `actor_token` is required when the code was issued for `requested_actor`)
        - **client_credentials**: Get a token for the client itself (no user involved)
        - **refresh_token**: Get a new access token using a refresh token
        - **device_code**: Poll for device authorization completion (RFC 8628)
        - **CIBA**: Poll for backchannel authentication completion
        - **token exchange**: Exchange a local access token, or, when `xaa.enabled` is true, exchange an ID token for an ID-JAG
        - **jwt-bearer**: Redeem an ID-JAG when `xaa.enabled` is true. The grant is rejected while the flag is off

        Client can authenticate via HTTP Basic auth or `client_id`/`client_secret` in the body.
      operationId: token
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - client_credentials
                    - refresh_token
                    - urn:ietf:params:oauth:grant-type:device_code
                    - urn:openid:params:grant-type:ciba
                    - urn:ietf:params:oauth:grant-type:token-exchange
                    - urn:ietf:params:oauth:grant-type:jwt-bearer
                  description: The grant type to use. jwt-bearer is accepted only when xaa.enabled is true.
                code:
                  type: string
                  description: Authorization code received from /oauth/authorize (authorization_code grant)
                redirect_uri:
                  type: string
                  description: Must match the redirect_uri from the authorization request (authorization_code grant)
                code_verifier:
                  type: string
                  description: PKCE code verifier that corresponds to the code_challenge (authorization_code grant)
                refresh_token:
                  type: string
                  description: Refresh token to exchange for a new access token (refresh_token grant)
                device_code:
                  type: string
                  description: Device code received from /oauth/device (device_code grant)
                auth_req_id:
                  type: string
                  description: Auth request ID received from /oauth/bc-authorize (CIBA grant)
                scope:
                  type: string
                  description: Requested scopes (optional, may be reduced by server)
                resource:
                  type: string
                  description: |
                    Resource indicator (RFC 8707). The URI of the resource server.
                    The issued token will be scoped to this resource.
                  example: "https://api.example.com"
                subject_token:
                  type: string
                  description: Token to exchange. An ID-JAG request sends an ID token.
                subject_token_type:
                  type: string
                  description: urn:ietf:params:oauth:token-type:id_token when requesting an ID-JAG
                requested_token_type:
                  type: string
                  description: urn:ietf:params:oauth:token-type:id-jag when requesting an ID-JAG
                audience:
                  type: string
                  description: Resource authorization server issuer for an ID-JAG request
                assertion:
                  type: string
                  description: ID-JAG for the jwt-bearer grant
                client_id:
                  type: string
                  description: Client ID (alternative to HTTP Basic auth)
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic auth)
            examples:
              authorization_code:
                summary: Authorization Code Grant with PKCE
                value:
                  grant_type: authorization_code
                  code: "SplxlOBeZQQYbYS6WxSbIA"
                  redirect_uri: "https://example.com/callback"
                  code_verifier: "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"
              client_credentials:
                summary: Client Credentials Grant
                value:
                  grant_type: client_credentials
                  scope: "read write"
              refresh_token:
                summary: Refresh Token Grant
                value:
                  grant_type: refresh_token
                  refresh_token: "tGzv3JOkF0XG5Qx2TlKWIA"
              device_code:
                summary: Device Code Grant (polling)
                value:
                  grant_type: "urn:ietf:params:oauth:grant-type:device_code"
                  device_code: "GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS"
              ciba:
                summary: CIBA Grant (polling)
                value:
                  grant_type: "urn:openid:params:grant-type:ciba"
                  auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: "Bearer"
                expires_in: 3600
                refresh_token: "tGzv3JOkF0XG5Qx2TlKWIA"
                scope: "openid profile"
                id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Error response (invalid grant, expired code, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                invalid_grant:
                  summary: Invalid or expired authorization code
                  value:
                    error: invalid_grant
                    error_description: "Invalid authorization code"
                authorization_pending:
                  summary: Device/CIBA not yet authorized (continue polling)
                  value:
                    error: authorization_pending
                    error_description: "User has not yet approved the request"
                slow_down:
                  summary: Polling too fast (increase interval)
                  value:
                    error: slow_down
                    error_description: "Polling too frequently"

  /oauth/revoke:
    post:
      tags: [OAuth 2.0]
      summary: Token revocation (RFC 7009)
      description: |
        Revokes an access token or refresh token. Invalidates the token immediately.
        Revoking a refresh token also invalidates the associated access token.

        See [RFC 7009](https://datatracker.ietf.org/doc/html/rfc7009) for details.
      operationId: revokeToken
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The token to revoke
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: Hint about the token type (optional, helps server locate token faster)
                client_id:
                  type: string
                  description: Client ID (alternative to HTTP Basic auth)
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic auth)
            example:
              token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
              token_type_hint: "access_token"
      responses:
        "200":
          description: Token revoked successfully (or token was already invalid)
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth/introspect:
    post:
      tags: [OAuth 2.0]
      summary: Token introspection (RFC 7662)
      description: |
        Allows a protected resource to query the authorization server about the state of a token.
        Returns whether the token is active, along with metadata like scopes, client_id, and subject.

        See [RFC 7662](https://datatracker.ietf.org/doc/html/rfc7662) for details.
      operationId: introspectToken
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The token to introspect
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: Hint about the token type
                client_id:
                  type: string
                  description: Client ID (alternative to HTTP Basic auth)
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic auth)
            example:
              token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Token introspection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectionResponse"
              examples:
                active_token:
                  summary: Active token
                  value:
                    active: true
                    scope: "openid profile"
                    client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    username: "johndoe"
                    token_type: "Bearer"
                    exp: 1718003600
                    iat: 1718000000
                    sub: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                inactive_token:
                  summary: Inactive (expired or revoked) token
                  value:
                    active: false

  /oauth/device:
    post:
      tags: [Device]
      summary: Device authorization (RFC 8628)
      description: |
        Initiates the Device Authorization Grant for input-constrained devices (smart TVs, IoT, CLI tools).

        Returns a `device_code`, `user_code`, and `verification_uri`. The user visits the verification URI
        on another device and enters the user code. The client polls `/oauth/token` with the device_code
        until the user completes authorization.

        See [RFC 8628](https://datatracker.ietf.org/doc/html/rfc8628) for details.
      operationId: deviceAuthorization
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  description: Requested scopes
                client_id:
                  type: string
                  description: Client ID (alternative to HTTP Basic auth)
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic auth)
            example:
              scope: "openid profile"
      responses:
        "200":
          description: Device authorization initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationResponse"
              example:
                device_code: "GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS"
                user_code: "WDJB-MJHT"
                verification_uri: "http://localhost:8080/device"
                verification_uri_complete: "http://localhost:8080/device?user_code=WDJB-MJHT"
                expires_in: 1800
                interval: 5
        "400":
          description: Client not authorized for device_code grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: unauthorized_client
                error_description: "Client not authorized for device_code grant"

  /oauth/par:
    post:
      tags: [OAuth 2.0]
      summary: Pushed Authorization Request (RFC 9126)
      description: |
        Pushes authorization request parameters directly to the authorization server, receiving a
        `request_uri` in return. The client then redirects the user-agent to `/oauth/authorize`
        with only `request_uri` and `client_id`.

        PAR provides confidentiality and integrity protection for authorization requests,
        and allows the server to validate requests before user interaction.

        See [RFC 9126](https://datatracker.ietf.org/doc/html/rfc9126) for details.
      operationId: pushedAuthorizationRequest
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [response_type, redirect_uri]
              properties:
                client_id:
                  type: string
                  description: Client identifier
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic auth)
                response_type:
                  type: string
                  enum:
                    [
                      code,
                      token,
                      id_token,
                      "code id_token",
                      "code token",
                      "code id_token token",
                      none,
                    ]
                  description: OAuth response type
                redirect_uri:
                  type: string
                  description: Redirect URI for the authorization response
                scope:
                  type: string
                  description: Requested scopes
                state:
                  type: string
                  description: CSRF protection value
                code_challenge:
                  type: string
                  description: PKCE code challenge
                code_challenge_method:
                  type: string
                  enum: [S256, plain]
                  description: PKCE challenge method
            example:
              response_type: code
              client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              redirect_uri: "https://example.com/callback"
              scope: "openid profile"
              state: "xyz123"
              code_challenge: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
              code_challenge_method: S256
      responses:
        "201":
          description: PAR created successfully. Use the returned `request_uri` in /oauth/authorize.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PARResponse"
              example:
                request_uri: "urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c"
                expires_in: 60
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: "Invalid redirect_uri"

  /oauth/bc-authorize:
    post:
      tags: [CIBA]
      summary: CIBA backchannel authentication
      description: |
        Initiates Client-Initiated Backchannel Authentication (CIBA) for decoupled authentication flows.

        The client sends a hint identifying the user (e.g., `login_hint`). The authorization server
        authenticates the user out-of-band (e.g., push notification on their phone). The client
        polls `/oauth/token` with the returned `auth_req_id`.

        The `scope` parameter MUST include `openid`.

        For ping/push delivery modes, `client_notification_token` is required.
      operationId: cibaAuthorize
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  description: Requested scopes (MUST include "openid")
                  example: "openid profile"
                login_hint:
                  type: string
                  description: Hint identifying the user (e.g., username, email, phone)
                  example: "johndoe"
                id_token_hint:
                  type: string
                  description: Previously issued ID token as a hint
                login_hint_token:
                  type: string
                  description: JWT containing user identification
                binding_message:
                  type: string
                  description: Human-readable message shown on the authentication device (max 128 chars)
                  example: "Approve login from Smart TV"
                user_code:
                  type: string
                  description: Secret code known to the user (prevents unsolicited auth requests)
                  example: "123456"
                client_notification_token:
                  type: string
                  description: Bearer token for authenticating ping/push callbacks
                requested_expiry:
                  type: integer
                  description: Requested lifetime of the auth_req_id in seconds
                  example: 120
                client_id:
                  type: string
                  description: Client ID (alternative to HTTP Basic auth)
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic auth)
      responses:
        "200":
          description: CIBA authentication initiated. Poll /oauth/token with the auth_req_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CIBAResponse"
              example:
                auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
                expires_in: 120
                interval: 5
        "400":
          description: Invalid request or client not authorized for CIBA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: unauthorized_client
                error_description: "Client not authorized for CIBA grant"

  # ──────────────────────────────────────────────
  # OIDC Endpoints
  # ──────────────────────────────────────────────

  /.well-known/openid-configuration:
    get:
      tags: [OIDC]
      summary: OpenID Connect Discovery
      description: |
        Returns the OpenID Connect Discovery document containing all server metadata:
        endpoint URLs, supported scopes, grant types, signing algorithms, etc.

        Clients use this to auto-configure themselves.
      operationId: oidcDiscovery
      responses:
        "200":
          description: OIDC discovery document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCDiscovery"
              example:
                issuer: "http://localhost:8080"
                authorization_endpoint: "http://localhost:8080/oauth/authorize"
                token_endpoint: "http://localhost:8080/oauth/token"
                userinfo_endpoint: "http://localhost:8080/oidc/userinfo"
                jwks_uri: "http://localhost:8080/oidc/jwks"
                registration_endpoint: "http://localhost:8080/oauth/register"
                revocation_endpoint: "http://localhost:8080/oauth/revoke"
                introspection_endpoint: "http://localhost:8080/oauth/introspect"
                device_authorization_endpoint: "http://localhost:8080/oauth/device"
                pushed_authorization_request_endpoint: "http://localhost:8080/oauth/par"
                backchannel_authentication_endpoint: "http://localhost:8080/oauth/bc-authorize"
                scopes_supported:
                  [
                    "openid",
                    "profile",
                    "email",
                    "address",
                    "phone",
                    "offline_access",
                  ]
                response_types_supported:
                  [
                    "code",
                    "token",
                    "id_token",
                    "code id_token",
                    "code token",
                    "code id_token token",
                    "none",
                  ]
                response_modes_supported: ["query", "fragment"]
                grant_types_supported:
                  [
                    "authorization_code",
                    "client_credentials",
                    "refresh_token",
                    "urn:ietf:params:oauth:grant-type:device_code",
                    "urn:openid:params:grant-type:ciba",
                  ]
                token_endpoint_auth_methods_supported:
                  [
                    "client_secret_basic",
                    "client_secret_post",
                    "client_secret_jwt",
                    "private_key_jwt",
                    "none",
                  ]
                token_endpoint_auth_signing_alg_values_supported:
                  ["RS256", "ES256"]
                subject_types_supported: ["public", "pairwise"]
                id_token_signing_alg_values_supported: ["RS256", "ES256"]
                code_challenge_methods_supported: ["S256", "plain"]
                claims_supported:
                  [
                    "sub",
                    "name",
                    "given_name",
                    "family_name",
                    "preferred_username",
                    "email",
                    "email_verified",
                    "phone_number",
                    "picture",
                    "locale",
                    "updated_at",
                  ]
                claims_parameter_supported: true
                request_parameter_supported: true
                request_uri_parameter_supported: true
                require_pushed_authorization_requests: false
                backchannel_token_delivery_modes_supported: ["poll"]
                backchannel_user_code_parameter_supported: false
                dpop_signing_alg_values_supported: ["ES256"]
                resource_indicators_supported: true
                authorization_response_iss_parameter_supported: true

  /.well-known/oauth-authorization-server:
    get:
      tags: [OIDC]
      summary: OAuth Authorization Server Metadata (RFC 8414)
      description: |
        Returns OAuth 2.0 Authorization Server Metadata as defined in RFC 8414.
        Same content as OpenID Connect Discovery for this server.
      operationId: asMetadata
      responses:
        "200":
          description: Authorization server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCDiscovery"

  /oidc/jwks:
    get:
      tags: [OIDC]
      summary: JSON Web Key Set
      description: |
        Returns the server's public keys in JWKS format. Clients and resource servers use these
        keys to verify JWT signatures (ID tokens, access tokens).

        The server generates RSA-2048 and EC P-256 keys on startup.
      operationId: jwks
      responses:
        "200":
          description: JWKS response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
              example:
                keys:
                  - kty: "RSA"
                    kid: "r1k2e3y4"
                    use: "sig"
                    alg: "RS256"
                    n: "0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM..."
                    e: "AQAB"
                  - kty: "EC"
                    kid: "e1c2k3e4y"
                    use: "sig"
                    alg: "ES256"
                    crv: "P-256"
                    x: "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU"
                    y: "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"

  /oidc/userinfo:
    get:
      tags: [OIDC]
      summary: UserInfo endpoint
      description: |
        Returns claims about the authenticated user. Requires a valid access token with `openid` scope.
        The claims returned depend on the scopes granted: `profile`, `email`, `phone`.
      operationId: userInfo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: UserInfo response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
              example:
                sub: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                name: "johndoe"
                preferred_username: "johndoe"
                given_name: "John"
                family_name: "Doe"
                email: "john@example.com"
                email_verified: true
                phone_number: "+1-555-123-4567"
                phone_number_verified: true
                picture: "https://example.com/johndoe/photo.jpg"
                locale: "en-US"
                updated_at: 1718000000
        "401":
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_token
                error_description: "Token not found"

  # ──────────────────────────────────────────────
  # Management API Endpoints
  # ──────────────────────────────────────────────

  /api/backup:
    get:
      tags: [Management]
      summary: Download a backup
      description: Returns users, clients, organizations, consents, and signing keys. The document includes secrets.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Backup document

  /api/restore:
    post:
      tags: [Management]
      summary: Restore a backup
      description: Refuses when the server already has users or clients unless force is true. dry_run writes nothing.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean }
        - name: force
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Counts of rows written or counted
        "409":
          description: The server already has users or clients

  /api/clients:
    get:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: List all clients
      description: Returns all registered OAuth clients.
      operationId: listClients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
              example:
                - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  name: "My Web App"
                  redirect_uris: ["https://example.com/callback"]
                  grant_types: ["authorization_code", "client_credentials"]
                  scopes: ["openid", "profile"]
                  token_endpoint_auth_method: "client_secret_basic"
                  dpop_bound_access_tokens: false
                  require_pushed_authorization_requests: false
                  created_at: "2026-06-16T10:00:00Z"
                  updated_at: "2026-06-16T10:00:00Z"
    post:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Create a new client
      description: |
        Creates a new OAuth client and returns it with a secret.
        Set `id` when a config file must name the client. Omit `id` and the server generates one.
        This endpoint uses `name` (not `client_name`, which is for dynamic registration).
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementClientCreate"
            example:
              name: "My Web App"
              redirect_uris: ["https://example.com/callback"]
              grant_types:
                ["authorization_code", "client_credentials", "refresh_token"]
              scopes: ["openid", "profile", "email"]
              token_endpoint_auth_method: "client_secret_basic"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                secret: "s3cr3t-k3y-h3r3-4nd-l0ng3r-th4n-th1s"
                name: "My Web App"
                redirect_uris: ["https://example.com/callback"]
                grant_types:
                  ["authorization_code", "client_credentials", "refresh_token"]
                scopes: ["openid", "profile", "email"]
                token_endpoint_auth_method: "client_secret_basic"
                dpop_bound_access_tokens: false
                require_pushed_authorization_requests: false
                created_at: "2026-06-16T10:00:00Z"
                updated_at: "2026-06-16T10:00:00Z"
        "400":
          description: Invalid request (name is required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/clients/{clientID}:
    get:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Get client by ID
      description: Returns a single client by its ID.
      operationId: getClient
      parameters:
        - name: clientID
          in: path
          required: true
          schema:
            type: string
          description: The client ID
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: not_found
                error_description: "Client not found"
    put:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Update client
      description: Updates an existing client. Only provided fields are updated.
      operationId: updateClient
      parameters:
        - name: clientID
          in: path
          required: true
          schema:
            type: string
          description: The client ID
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementClientCreate"
            example:
              name: "Updated App Name"
              scopes: ["openid", "profile", "email", "phone"]
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    delete:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Delete client
      description: Permanently deletes a client and all associated tokens.
      operationId: deleteClient
      parameters:
        - name: clientID
          in: path
          required: true
          schema:
            type: string
          description: The client ID
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Client deleted
          content:
            application/json:
              example:
                status: deleted

  /api/users:
    get:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: List all users
      description: Returns all registered users.
      operationId: listUsers
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
              example:
                - id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                  username: "johndoe"
                  email: "john@example.com"
                  phone_number: "+1-555-123-4567"
                  created_at: "2026-06-16T10:00:00Z"
    post:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Create a new user
      description: Creates a new user account with hashed password storage.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              username: "johndoe"
              password: "secureP@ss123"
              email: "john@example.com"
              phone_number: "+1-555-123-4567"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                username: "johndoe"
                email: "john@example.com"
                phone_number: "+1-555-123-4567"
                created_at: "2026-06-16T10:00:00Z"
        "400":
          description: Invalid request (username already exists, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: "username already exists"

  /api/users/import:
    post:
      tags: [Management]
      summary: Import users
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [create, upsert] }
                users: { type: array, items: { type: object } }
      responses:
        "200":
          description: Import counts and row errors

  /api/users/export:
    get:
      tags: [Management]
      summary: Export users
      security: [{ bearerAuth: [] }]
      parameters:
        - name: include_secrets
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Import document

  /api/users/{userID}:
    get:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Get user by ID
      description: Returns a single user by their ID.
      operationId: getUser
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
          description: The user ID
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    patch:
      tags: [Management]
      summary: Update a user profile or attributes
      description: Management can set `attributes`. Self-service `PATCH /api/me` cannot.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated user
        "404":
          description: User not found

  /api/tokens:
    get:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: List access tokens
      description: Lists access tokens, optionally filtered by client_id or user_id.
      operationId: listTokens
      parameters:
        - name: client_id
          in: query
          schema:
            type: string
          description: Filter by client ID
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        - name: user_id
          in: query
          schema:
            type: string
          description: Filter by user ID
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
              example:
                - token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                  scopes: ["openid", "profile"]
                  token_type: "Bearer"
                  expires_at: "2026-06-16T11:00:00Z"
                  revoked: false

  /api/tokens/{token}/revoke:
    post:
      tags: [Management]
      security: [{ bearerAuth: [] }]
      summary: Revoke a token (admin)
      description: Immediately revokes an access token by its value.
      operationId: revokeTokenAdmin
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The access token to revoke
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              example:
                status: revoked

  # ──────────────────────────────────────────────
  # Scope Management
  # ──────────────────────────────────────────────

  /api/scopes:
    get:
      tags: [Scopes]
      security: [{ bearerAuth: [] }]
      summary: List all scopes
      description: Returns all registered custom scopes.
      operationId: listScopes
      responses:
        "200":
          description: List of scopes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scope"
              example:
                - name: "read"
                  description: "Read access to resources"
                  resource_server: "https://api.example.com"
                  is_default: false
                  created_at: "2026-06-16T10:00:00Z"
                - name: "write"
                  description: "Write access to resources"
                  resource_server: "https://api.example.com"
                  is_default: false
                  created_at: "2026-06-16T10:00:00Z"
    post:
      tags: [Scopes]
      security: [{ bearerAuth: [] }]
      summary: Create a new scope
      description: Registers a new custom scope that can be assigned to clients and resources.
      operationId: createScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScopeRequest"
            example:
              name: "read"
              description: "Read access to resources"
              resource_server: "https://api.example.com"
              is_default: false
      responses:
        "201":
          description: Scope created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
              example:
                name: "read"
                description: "Read access to resources"
                resource_server: "https://api.example.com"
                is_default: false
                created_at: "2026-06-16T10:00:00Z"
        "409":
          description: Scope already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/scopes/{name}:
    get:
      tags: [Scopes]
      security: [{ bearerAuth: [] }]
      summary: Get scope by name
      description: Returns a single scope by its name.
      operationId: getScope
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The scope name
          example: "read"
      responses:
        "200":
          description: Scope details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "404":
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    delete:
      tags: [Scopes]
      security: [{ bearerAuth: [] }]
      summary: Delete a scope
      description: Permanently deletes a scope definition.
      operationId: deleteScope
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The scope name to delete
          example: "read"
      responses:
        "200":
          description: Scope deleted
          content:
            application/json:
              example:
                status: deleted

  # ──────────────────────────────────────────────
  # Resource Management (RFC 8707)
  # ──────────────────────────────────────────────

  /api/resources:
    get:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: List all resource servers
      description: Returns all registered resource servers.
      operationId: listResources
      responses:
        "200":
          description: List of resource servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
              example:
                - uri: "https://api.example.com"
                  name: "Example API"
                  description: "Main API server"
                  scopes: ["read", "write", "admin"]
                  created_at: "2026-06-16T10:00:00Z"
    post:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: Register a resource server
      description: Registers a new resource server with its allowed scopes (RFC 8707).
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
            example:
              uri: "https://api.example.com"
              name: "Example API"
              description: "Main API server"
              scopes: ["read", "write", "admin"]
      responses:
        "201":
          description: Resource server registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
              example:
                uri: "https://api.example.com"
                name: "Example API"
                description: "Main API server"
                scopes: ["read", "write", "admin"]
                created_at: "2026-06-16T10:00:00Z"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/resources/{uri}:
    get:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: Get resource server by URI
      description: Returns a single resource server by its URI.
      operationId: getResource
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The resource server URI (URL-encoded)
          example: "https://api.example.com"
      responses:
        "200":
          description: Resource server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    put:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: Update resource server
      description: Updates an existing resource server's metadata and scopes.
      operationId: updateResource
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The resource server URI
          example: "https://api.example.com"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
            example:
              name: "Updated API Name"
              description: "Updated description"
              scopes: ["read", "write", "admin", "delete"]
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Resource not found
    delete:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: Delete resource server
      description: Permanently deletes a resource server.
      operationId: deleteResource
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The resource server URI to delete
          example: "https://api.example.com"
      responses:
        "200":
          description: Resource deleted
          content:
            application/json:
              example:
                status: deleted

  /api/resources/{uri}/scopes:
    get:
      tags: [Resources]
      security: [{ bearerAuth: [] }]
      summary: List scopes for a resource
      description: Returns all scopes associated with a specific resource server.
      operationId: listResourceScopes
      parameters:
        - name: uri
          in: path
          required: true
          schema:
            type: string
          description: The resource server URI
          example: "https://api.example.com"
      responses:
        "200":
          description: List of scopes for the resource
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scope"

  # ──────────────────────────────────────────────
  # Consent Management
  # ──────────────────────────────────────────────

  /api/consents:
    get:
      tags: [Consents]
      security: [{ bearerAuth: [] }]
      summary: List consents for a user
      description: Returns all consents granted by a specific user.
      operationId: listConsents
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: The user ID
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      responses:
        "200":
          description: List of consents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consent"
              example:
                - id: "c1o2n3s4-e5n6-t789-abcd-ef1234567890"
                  user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                  client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  scopes: ["openid", "profile", "email"]
                  granted_at: "2026-06-16T10:00:00Z"
        "400":
          description: Missing user_id parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    delete:
      tags: [Consents]
      security: [{ bearerAuth: [] }]
      summary: Revoke a consent
      description: Deletes the consent and revokes that client's access and refresh tokens for the user. The signed-in user can do the same from `/profile` or `DELETE /api/me/consents/{clientID}`.
      operationId: revokeConsent
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: The user ID
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The client ID
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Consent revoked
          content:
            application/json:
              example:
                status: revoked
        "400":
          description: Missing parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  # ──────────────────────────────────────────────
  # CIBA Management
  # ──────────────────────────────────────────────

  /api/ciba/pending:
    get:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: List pending CIBA requests
      description: Returns all CIBA requests with status "pending" that haven't expired.
      operationId: listPendingCIBA
      responses:
        "200":
          description: List of pending CIBA requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CIBARequest"
              example:
                - auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
                  client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
                  binding_message: "Approve login from Smart TV"
                  status: "pending"
                  delivery_mode: "poll"
                  expires_at: "2026-06-16T10:02:00Z"
                  interval: 5

  /api/ciba/{authReqID}/approve:
    post:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: Approve CIBA request
      description: Approves a pending CIBA request, allowing the client to obtain tokens.
      operationId: approveCIBA
      parameters:
        - name: authReqID
          in: path
          required: true
          schema:
            type: string
          description: The CIBA auth_req_id
          example: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: User ID to associate with the approval
            example:
              user_id: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      responses:
        "200":
          description: CIBA request approved
          content:
            application/json:
              example:
                status: approved

  /api/ciba/{authReqID}/deny:
    post:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: Deny CIBA request
      description: Denies a pending CIBA request. The client will receive an "access_denied" error.
      operationId: denyCIBA
      parameters:
        - name: authReqID
          in: path
          required: true
          schema:
            type: string
          description: The CIBA auth_req_id
          example: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for denial
            example:
              reason: "Suspicious login attempt"
      responses:
        "200":
          description: CIBA request denied
          content:
            application/json:
              example:
                status: denied

  # ──────────────────────────────────────────────
  # Device Verification (browser-facing)
  # ──────────────────────────────────────────────

  /device:
    get:
      tags: [Device]
      summary: Device verification page
      description: |
        HTML form where the user enters the user_code displayed on their device.
        Optionally accepts `user_code` as a query parameter to pre-fill the form.
      operationId: deviceVerificationPage
      parameters:
        - name: user_code
          in: query
          schema:
            type: string
          description: Pre-filled user code from the device
          example: "WDJB-MJHT"
      responses:
        "200":
          description: HTML verification form
          content:
            text/html:
              example: "<html><body><form>Enter code: <input name='user_code'/></form></body></html>"
    post:
      tags: [Device]
      summary: Submit device verification
      description: |
        Processes the device verification form. If the user_code is valid and not expired,
        marks the device code as approved.
      operationId: deviceVerificationSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  description: The code displayed on the device
                  example: "WDJB-MJHT"
                user_id:
                  type: string
                  description: User ID for approval
      responses:
        "200":
          description: Verification approved (HTML confirmation page)
          content:
            text/html:
              example: "<html><body><h1>Authorization Approved</h1><p>You can return to your device.</p></body></html>"

  # ──────────────────────────────────────────────
  # CIBA Polling (mobile-facing)
  # ──────────────────────────────────────────────

  /ciba/pending:
    get:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: List pending CIBA requests (mobile)
      description: Returns pending CIBA requests for the mobile polling CLI.
      operationId: cibaPending
      responses:
        "200":
          description: List of pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CIBARequest"

  /ciba/poll:
    get:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: Long-poll for CIBA requests
      description: |
        Long-polls for the next pending CIBA request. Blocks for up to 30 seconds
        until a request arrives or timeout occurs.
      operationId: cibaPoll
      responses:
        "200":
          description: Next pending request or timeout status
          content:
            application/json:
              examples:
                pending_request:
                  summary: A pending request was found
                  value:
                    auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
                    client_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    binding_message: "Approve login"
                    status: "pending"
                timeout:
                  summary: No pending requests (timeout)
                  value:
                    status: no_pending_requests

  /ciba/approve:
    post:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: Approve CIBA request (mobile)
      description: Approves a CIBA request from the mobile polling CLI.
      operationId: cibaApprove
      parameters:
        - name: auth_req_id
          in: query
          required: true
          schema:
            type: string
          description: The CIBA auth_req_id
          example: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
        - name: user_id
          in: query
          schema:
            type: string
          description: User ID to associate with approval
          example: "b5c6d7e8-f9a0-1234-5678-9abcdef01234"
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              example:
                status: approved

  /ciba/deny:
    post:
      tags: [CIBA]
      security: [{ bearerAuth: [] }]
      summary: Deny CIBA request (mobile)
      description: Denies a CIBA request from the mobile polling CLI.
      operationId: cibaDeny
      parameters:
        - name: auth_req_id
          in: query
          required: true
          schema:
            type: string
          description: The CIBA auth_req_id
          example: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
        - name: reason
          in: query
          schema:
            type: string
          description: Reason for denial
          example: "User denied"
      responses:
        "200":
          description: Request denied
          content:
            application/json:
              example:
                status: denied

# ──────────────────────────────────────────────
# Components
# ──────────────────────────────────────────────

  /api/account/email/verify:
    post:
      tags: [CIAM]
      summary: Confirm an email address with a token
