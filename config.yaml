# Atrium Configuration
server:
  host: "0.0.0.0"
  port: 8443
  tls:
    enabled: true
    cert_file: "./certs/server.crt"
    key_file: "./certs/server.key"
    client_ca: "./certs/ca.crt"
    client_auth: "request" # none, request, require, require_and_verify
    crl_file: "./certs/crl.pem"

email:
  templates_dir: ""

org:
  enabled: false
  enabled_domain_based_autolookup: false

log:
  format: text

telemetry:
  enabled: false
  service_name: atrium
  otlp_endpoint: ""
  insecure: false
  sample_ratio: 1

database:
  driver: sqlite
  path: "./atrium.db"
  dsn: ""
  migrations: true

security:
  access_token_lifetime: 3600s
  refresh_token_lifetime: 86400s
  authorization_code_lifetime: 600s
  device_code_lifetime: 1800s
  ciba_request_lifetime: 120s
  request_uri_lifetime: 60s
  login_identifier: username
  require_pkce: false
  allow_plain_pkce: true
  issuer: "https://localhost:8443"
  hash_algo: "internal/hashalgo/algo.go"
  access_token_format: "opaque"
  session_lifetime: 8h
  reset_token_lifetime: 30m
  trusted_proxies: []
  disable_registration: true
  disable_social_registration: false
  allow_insecure_fetch: false
  fetch_allow_ips: []
  password:
    min_length: 8
    max_length: 128
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_symbol: false
    block_username: true
  bot_protection:
    provider: ""
    site_key: ""
    secret_key: ""
  mfa:
    enabled: false
    required: false
    issuer: "Atrium"
    digits: 6
    period: 30
  mtls:
    enabled: true
    cert_binding: true # Bind tokens to client certs
    bind_refresh_token: false
    require_for_token: false # Require mTLS for token endpoint
  dpop:
    enabled: true
    proof_lifetime: 300 # 5 minutes
    nonce_required: false
    nonce_lifetime: 300

management:
  client_id: ""
  client_secret: ""

smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
  starttls: true
  implicit_tls: false

social:
  providers: []

branding:
  product_name: "Atrium"
  login_title: "Sign In"
  username_label: "Username"
  password_label: "Password"
  submit_label: "Sign In"
  assets_dir: ""
  logo_file: ""
  favicon_file: ""
  background_file: ""
  primary_color: "#445f88"
  background_color: ""
  text_color: ""
  footer_text: ""
  support_url: ""
  privacy_url: ""
  terms_url: ""
  show_register: true
  show_forgot_password: true
  templates: ""

registration:
  dcr_enabled: true
  cimd_enabled: false

redis:
  addr: ""
  username: ""
  password: ""
  db: 0
  prefix: atrium

cache:
  provider: memory

queue:
  type: "memory"
  poll_interval: 5s
  max_pending: 100

oidc:
  issuer: "https://localhost:8443"
  key_rotation_interval: 0s
  key_retain: 48h
  claim_mappings: []
  supported_scopes:
    - openid
    - profile
    - email
    - address
    - phone
    - offline_access
    - read
    - write
    - admin
  supported_claims:
    - sub
    - name
    - given_name
    - family_name
    - middle_name
    - nickname
    - preferred_username
    - profile
    - picture
    - website
    - email
    - email_verified
    - gender
    - birthdate
    - zoneinfo
    - locale
    - phone_number
    - phone_number_verified
    - address
    - updated_at
  supported_grant_types:
    - authorization_code
    - client_credentials
    - refresh_token
    - password
    - urn:ietf:params:oauth:grant-type:device_code
    - urn:openid:params:grant-type:ciba
    - urn:ietf:params:oauth:grant-type:token-exchange
  supported_auth_methods:
    - client_secret_basic
    - client_secret_post
    - client_secret_jwt
    - private_key_jwt
    - none
    - tls_client_auth
    - self_signed_tls_client_auth

debug:
  ui: true
