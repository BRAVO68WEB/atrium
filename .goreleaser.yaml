version: 2

project_name: atrium

builds:
  - id: atrium
    main: ./cmd/atrium
    binary: atrium
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=embed
    ldflags: &ldflags
      - -s -w
      - -X github.com/bravo68web/atrium/internal/version.Version={{.Version}}
      - -X github.com/bravo68web/atrium/internal/version.Commit={{.Commit}}
      - -X github.com/bravo68web/atrium/internal/version.Date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
  - id: atrium-cli
    main: ./cmd/atrium-cli
    binary: atrium-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags: *ldflags
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
  - id: atrium-mobile
    main: ./cmd/atrium-mobile
    binary: atrium-mobile
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags: *ldflags
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: internal/hashalgo/algo.go
        dst: internal/hashalgo
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  prerelease: auto
