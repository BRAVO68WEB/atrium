{{template "head" .}}
    <div class="sheet-narrow">
    <h1>Enter the code</h1>
    <p class="who">From your authenticator app.</p>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/login/mfa">
        {{template "oauth_fields" .}}
        <div class="form-group">
            <label class="visually-hidden" for="code">Verification code</label>
            <input type="text" class="code" id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code">
        </div>
        <button type="submit">Continue</button>
    </form>
    </div>
{{template "card_close" .}}
{{template "brand_footer" .}}
