{{template "head" .}}
    <div class="sheet-narrow">
    {{if .Error}}
    {{template "stopped" .}}
    {{else}}
    <h1>Copy this code</h1>
    <p class="who">Paste it into the application that asked you to sign in.</p>
    <div class="form-group">
        <label class="visually-hidden" for="authorization-code">Authorization code</label>
        <input class="display" type="text" id="authorization-code" readonly value="{{.Code}}" onclick="this.select()">
    </div>
    {{if .State}}<p class="code-meta"><span class="code-meta-label">State</span>{{.State}}</p>{{end}}
    {{end}}
    </div>
{{template "card_close" .}}
{{template "brand_footer" .}}
