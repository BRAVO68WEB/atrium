{{template "head" .}}
    <div class="sheet-narrow">
    {{if .Error}}
    {{template "stopped" .}}
    {{else}}
    <h1>Copy this code</h1>
    <p class="who">Paste this value, or this page's address, into the application.</p>
    <div class="form-group">
        <label class="visually-hidden" for="combined-code">Authorization code</label>
        <input class="display" type="text" id="combined-code" readonly value="{{.Combined}}" onclick="this.select()">
    </div>
    {{end}}
    </div>
{{template "card_close" .}}
{{template "brand_footer" .}}
