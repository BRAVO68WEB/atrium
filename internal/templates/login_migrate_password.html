{{/* Password step after the email code. Field names: password, password_confirm, csrf_token, plus oauth_fields. */}}
{{template "head" .}}
    <h1>Choose a password</h1>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/login/migrate/password">
        {{template "oauth_fields" .}}
        <div class="form-group">
            <label for="password">{{.Brand.PasswordLabel}}</label>
            <input type="password" id="password" name="password" required autofocus autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="password_confirm">Confirm password</label>
            <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
        </div>
        <button type="submit">Save and sign in</button>
    </form>
{{template "card_close" .}}
{{template "brand_footer" .}}
