server:
  host: 0.0.0.0
  port: 8080
database:
  driver: postgres
  dsn: postgres://oauth:oauth@postgres:5432/oauth?sslmode=disable
security:
  issuer: http://localhost:8080
smtp:
  enabled: true
  host: mailpit
  port: 1025
  from: oauth@localhost
  starttls: false
  implicit_tls: false
management:
  client_id: management
  client_secret: change-me
