services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_DB: oauth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth"]
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"
  webhook-tester:
    image: ghcr.io/tarampampam/webhook-tester:2.3.0
    command: ["start", "--auto-create-sessions"]
    ports:
      - "8089:8080"
  atrium:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["-config", "/config/config.yaml"]
    environment:
      ATRIUM_IN_DOCKER: "1"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml
volumes:
  pgdata:
